name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Public values, already shipped in the client bundle by design
      # (see lib/sanity.api.ts) — the dataset is publicly readable, so no
      # token is needed to build. Not secrets.
      NEXT_PUBLIC_SANITY_PROJECT_ID: j3f9z8os
      NEXT_PUBLIC_SANITY_DATASET: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Sanity TypeGen freshness
        run: |
          npm run typegen
          if ! git diff --exit-code sanity.types.ts; then
            echo "::error::sanity.types.ts is out of date — run 'npm run typegen' and commit the result."
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        # webkit backs the mobile-safari project (playwright.config.ts) --
        # the only WebKit/iOS coverage this suite has. Measured: the full
        # suite across all three projects (chromium, mobile-safari,
        # mobile-chrome), post-build, took ~1.5m (901 tests, 6 workers).
        run: npx playwright install --with-deps chromium webkit

      - name: E2E tests
        run: npm run test:e2e
