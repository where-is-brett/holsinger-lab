name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Public values, already shipped in the client bundle by design
      # (see lib/sanity.api.ts) — the dataset is publicly readable, so no
      # token is needed to build. Not secrets.
      NEXT_PUBLIC_SANITY_PROJECT_ID: j3f9z8os
      NEXT_PUBLIC_SANITY_DATASET: production
      # This branch (redesign/wix-site) replaces the page layer with a
      # Wix-styled site whose content (team, publications, media, etc.) does
      # not exist in the `production` dataset above -- only in `wix-preview`,
      # once the import has run there. WIX_FIXTURE=1 makes lib/wix/fetch.ts
      # run the site's real GROQ queries through groq-js over the committed
      # data/wix/fixture.ndjson snapshot instead, so both the Build step and
      # Playwright's webServer (which inherits this job env) build and serve
      # in fixture mode. This CI run verifies the site against that committed
      # Wix snapshot, not against real data -- it is a stable substitute, not
      # full acceptance. Acceptance against real content is a manual run of
      # `test:e2e` (with WIX_FIXTURE unset) against the wix-preview dataset,
      # done by hand before merging changes that affect imported content.
      WIX_FIXTURE: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Sanity TypeGen freshness
        run: |
          npm run typegen
          if ! git diff --exit-code sanity.types.ts; then
            echo "::error::sanity.types.ts is out of date — run 'npm run typegen' and commit the result."
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        # webkit backs the mobile-safari project (playwright.config.ts) --
        # the only WebKit/iOS coverage this suite has. Adding the two device
        # projects (mobile-safari, mobile-chrome) alongside chromium adds
        # ~22s to the E2E step below (measured: whole suite across all three
        # projects, post-build, 21.8s).
        run: npx playwright install --with-deps chromium webkit

      - name: E2E tests
        run: npm run test:e2e
